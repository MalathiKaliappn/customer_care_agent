version: '3.9'

services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: streamlit run src/main.py --server.port=8501 --server.enableCORS=false --server.enableXsrfProtection=false

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONPATH=/app/src
    command: uvicorn api.fastapi_app:app --host 0.0.0.0 --port 8000 --reload

