version: '3.9'

services:
  # Streamlit Service
  streamlit:
    build:
      context: .  # Build from the current directory
      dockerfile: Dockerfile  # Explicitly reference the Dockerfile
    ports:
      - "8501:8501"  # Expose Streamlit app on port 8501
    volumes:
      - .:/app  # Mount the current directory into /app inside the container
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}  # Set the environment variable from .env file
    command: streamlit run src/main.py  # Command to run the Streamlit app

  # Knowledge Base Upload Service
  kb-upload:
    build:
      context: .  # Build from the current directory
      dockerfile: Dockerfile  # Explicitly reference the Dockerfile
    volumes:
      - .:/app  # Mount the current directory into /app inside the container
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}  # Set the environment variable from .env file
    command: python jobs/kb-upload.py  # Command to run the KB upload script
